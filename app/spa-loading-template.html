<script>
  ;(function () {
    try {
      var stored = localStorage.getItem('sentec-tasks-theme')
      // 'auto' (device mode, the default) and a missing value both fall through
      // to the OS preference, so device mode resolves before hydration too.
      var dark =
        stored === 'dark' ||
        (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.classList.add(dark ? 'dark' : 'light')
    } catch (e) {}
  })()
</script>

<style>
  html {
    background: var(--background, oklch(1 0 0));
  }

  #sb-splash {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--background, oklch(1 0 0));
    color: var(--primary, #27a5f7);
  }

  .sb-logo {
    width: clamp(112px, 26vw, 184px);
    height: auto;
  }

  .sb-sheen {
    transform-box: view-box;
    mix-blend-mode: hard-light;
    animation: sb-sweep 1.5s ease-in-out infinite;
  }

  @keyframes sb-sweep {
    from { transform: translateX(-100%); }
    to   { transform: translateX(100%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .sb-sheen { animation: none; opacity: 0; }
    .sb-logo { animation: sb-pulse 2.4s ease-in-out infinite; }
    @keyframes sb-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
  }
</style>
